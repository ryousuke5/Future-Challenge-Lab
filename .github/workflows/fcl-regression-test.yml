name: FCL regression test stability

on:
  push:
    branches:
      - fix/test-stability-20260921

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --test tests/core-v02.test.js tests/supporter-module.test.js
