<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Future Challenge Lab</title><link rel="stylesheet" href="style.css"></head><body><main>
<header><div><span class="eyebrow">FUTURE CHALLENGE LAB</span><h1>挑戦継続エンジン</h1><p>現在地を測り、自己決定を回復し、行動と支援につなげる。</p></div><span id="mode" class="pill">checking…</span></header>
<section class="card"><h2>1. 挑戦者登録</h2><div class="grid"><input id="name" placeholder="名前"><input id="email" placeholder="メール"><input id="challenge" placeholder="挑戦テーマ"><input id="goal" placeholder="目標"></div><button onclick="register()">登録する</button><span id="participantStatus"></span></section>
<section class="card"><h2>2. 毎日チェックイン</h2><p>各問 1〜5点。高いほど「自分で選べている」状態。</p><div id="questions"></div><button onclick="checkin()">AI分析する</button><div id="analysis" class="result-panel"></div></section>
<section class="card"><h2>3. 介入 → 行動結果</h2><div id="decisionBanner" class="decision"></div><div id="intervention"></div><textarea id="action" placeholder="今日、自分で選んだ一歩"></textarea><label><input type="checkbox" id="completed"> 実行できた</label><input id="barrier" placeholder="できなかった場合の障壁"><textarea id="resultNote" placeholder="結果メモ"></textarea><button onclick="saveAction()">結果を保存</button><span id="actionStatus"></span></section>
<section class="card"><h2>4. 支援企業・支援者登録</h2><div class="grid"><input id="org" placeholder="企業・団体名"><input id="supporter" placeholder="担当者名"><input id="supportEmail" placeholder="メール"><input id="category" placeholder="支援カテゴリ"></div><input id="strengths" placeholder="強み（カンマ区切り）"><input id="timing" placeholder="支援タイミング（例：離脱前,再開時）"><textarea id="desc" placeholder="どんな挑戦者を支援できるか"></textarea><button onclick="registerSupporter()">支援パートナー登録</button><span id="supportStatus"></span></section>
<section class="card"><h2>5. 支援者マッチング</h2><p>介入最適化AIは「AI介入」「支援者」「AI＋支援者」を同じ候補群として比較します。</p><p>現在の状態から支援者候補が自動で評価され、最適な支援が推奨されます。</p><button onclick="showSupporterCandidates()">支援候補を表示する</button><div id="matches"></div></section>
<section class="card"><h2>6. 研究ダッシュボード</h2><button onclick="dashboard()">最新データを見る</button><div id="dash" class="dashboard-panel"></div></section>
</main><script src="app.js"></script></body></html>
