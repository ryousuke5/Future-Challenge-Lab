<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCL｜あなたの挑戦の物語</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:#f6f7f9}main{max-width:960px;margin:auto;padding:28px 16px 64px}
.hero,.challenge-group,.story-detail{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
.hero{padding:26px;margin-bottom:16px}.hero h1{font-size:30px;margin:8px 0}.hero p{line-height:1.75;color:#475569;margin:6px 0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:#64748b;font-weight:700}.muted{color:#64748b;font-size:13px}
.loading,.empty,.error{padding:16px;border-radius:14px}.loading,.empty{background:#f8fafc;color:#64748b}.error{background:#fef2f2;color:#991b1b}
.challenge-group{padding:20px;margin:16px 0}.challenge-group h2{margin:4px 0 14px;font-size:21px}.challenge-summary{color:#64748b;font-size:13px;margin-bottom:12px}
.person-list{display:grid;gap:10px}.person-card{display:block;width:100%;text-align:left;padding:16px;border:1px solid #e2e8f0;border-radius:15px;background:#f8fafc;color:#111827;cursor:pointer;font:inherit}
.person-card:hover{border-color:#94a3b8;background:#fff}.person-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.person-name{font-size:17px;font-weight:800}.person-goal{margin-top:7px;color:#475569;line-height:1.6}.click-note{font-size:12px;color:#64748b;white-space:nowrap}
.story-detail{margin-top:10px;padding:18px;background:#fff}.detail-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail-header h3{margin:0 0 5px;font-size:19px}.detail-block{margin-top:14px;padding:14px;border-radius:13px;background:#f8fafc}.detail-block h4{margin:0 0 7px;font-size:14px}.detail-block p{margin:0;line-height:1.8;color:#334155;white-space:pre-wrap}
.detail-close{border:1px solid #cbd5e1;background:#fff;color:#111827;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}
@media(max-width:650px){.person-top,.detail-header{flex-direction:column;align-items:flex-start}.click-note{white-space:normal}}
</style>
</head>
<body><main>
<section class="hero">
  <div class="eyebrow">YOUR CHALLENGE STORY</div>
  <h1>あなたの挑戦の物語</h1>
  <p>挑戦テーマごとに、そこにいる人の物語を見つけられます。</p>
  <p class="muted">本人が公開を承認した「挑戦の物語」のみ表示しています。人をクリックすると、その人の物語の内容が開きます。</p>
</section>
<section id="storyIndex">
  <div class="loading">挑戦の物語を読み込んでいます…</div>
</section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#39;");

  function parseStoryText(value){
    if(!value) return {};
    try{
      const parsed=JSON.parse(value);
      return parsed && typeof parsed === 'object' ? parsed : {};
    }catch(error){
      return {raw:String(value)};
    }
  }

  function detailHtml(story){
    const raw = story?.raw || '';
    const fields = [
      ['これまでの物語', story?.past || ''],
      ['目指していること', story?.hope || ''],
      ['必要としている支援', story?.support_need || '']
    ].filter(([,value]) => String(value || '').trim());

    if(!fields.length && raw) fields.push(['物語',raw]);
    if(!fields.length) fields.push(['物語', '公開された詳細はまだありません。']);

    return fields.map(([title,value]) =>
      '<div class="detail-block"><h4>'+esc(title)+'</h4><p>'+esc(value)+'</p></div>'
    ).join('');
  }

  async function load(){
    try{
      const response=await fetch('/api/story-index');
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.error || '物語の取得に失敗しました。');

      const stories=Array.isArray(data.stories) ? data.stories : [];
      if(!stories.length){
        $('storyIndex').innerHTML='<div class="empty">現在、公開されている挑戦の物語はありません。</div>';
        return;
      }

      const groups=new Map();
      stories.forEach(story=>{
        const challenge=story.challenge || '挑戦テーマ未登録';
        if(!groups.has(challenge)) groups.set(challenge,[]);
        groups.get(challenge).push(story);
      });

      let personNo=0;
      $('storyIndex').innerHTML=[...groups.entries()].map(([challenge,people])=>{
        const cards=people.map(person=>{
          const id='story-person-'+(++personNo);
          const story=person.story || {};
          return '<div>' +
            '<button type="button" class="person-card" aria-expanded="false" aria-controls="'+id+'">' +
              '<div class="person-top"><span class="person-name">'+esc(person.name || '匿名の挑戦者')+'</span><span class="click-note">クリックして物語を見る</span></div>' +
              (person.goal ? '<div class="person-goal">目標：'+esc(person.goal)+'</div>' : '') +
            '</button>' +
            '<div id="'+id+'" class="story-detail" hidden>' +
              '<div class="detail-header"><div><h3>'+esc(person.name || '匿名の挑戦者')+'</h3><div class="muted">'+esc(challenge)+'</div></div><button type="button" class="detail-close">閉じる</button></div>' +
              (story.title ? '<p class="muted" style="margin-top:10px;">'+esc(story.title)+'</p>' : '') +
              detailHtml(story) +
            '</div>' +
          '</div>';
        }).join('');

        return '<section class="challenge-group">' +
          '<div class="eyebrow">CHALLENGE</div>' +
          '<h2>'+esc(challenge)+'</h2>' +
          '<div class="challenge-summary">'+people.length+'人の挑戦者</div>' +
          '<div class="person-list">'+cards+'</div>' +
        '</section>';
      }).join('');

      document.querySelectorAll('.person-card').forEach(button=>{
        button.addEventListener('click',()=>{
          const detail=document.getElementById(button.getAttribute('aria-controls'));
          const open=!detail.hidden;
          detail.hidden=open;
          button.setAttribute('aria-expanded',String(!open));
        });
      });

      document.querySelectorAll('.detail-close').forEach(button=>{
        button.addEventListener('click',()=>{
          const detail=button.closest('.story-detail');
          const personButton=detail?.previousElementSibling;
          if(detail) detail.hidden=true;
          if(personButton) personButton.setAttribute('aria-expanded','false');
        });
      });
    }catch(error){
      $('storyIndex').innerHTML='<div class="error">'+esc(error.message || '物語の取得に失敗しました。')+'</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
