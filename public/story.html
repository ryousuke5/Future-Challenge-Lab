<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCL｜あなたの挑戦の物語</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:#f6f7f9}main{max-width:900px;margin:auto;padding:28px 16px 64px}
.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
.hero{padding:26px;margin-bottom:16px}.card{padding:20px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#64748b;font-weight:700}
h1{font-size:30px;margin:8px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 6px}p{line-height:1.7;margin:6px 0}.muted{color:#64748b;font-size:13px}
.user-bar{display:flex;gap:10px;align-items:center;margin-top:18px}input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}button.secondary{background:#fff;color:#111827;border:1px solid #cbd5e1}
button:disabled{opacity:.6}.error{padding:12px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-bottom:14px}
.story-head{padding:18px;border-radius:16px;background:#f8fafc;margin-bottom:16px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.timeline{position:relative;margin:8px 0 0 8px;padding-left:25px;border-left:2px solid #e2e8f0}.event{position:relative;padding:0 0 24px}.event:last-child{padding-bottom:0}
.event:before{content:"";position:absolute;left:-32px;top:4px;width:12px;height:12px;border-radius:50%;background:#64748b;border:3px solid #fff;box-shadow:0 0 0 2px #e2e8f0}
.date{font-size:12px;color:#64748b;margin-bottom:3px}.tag{font-size:12px;font-weight:700;color:#475569}.empty{padding:14px;background:#f8fafc;border-radius:12px;color:#64748b}
@media(max-width:650px){.user-bar{flex-direction:column;align-items:stretch}}
</style>
</head>
<body><main>
<section class="hero">
<div class="eyebrow">YOUR CHALLENGE STORY</div>
<h1>あなたの挑戦の物語</h1>
<p>できた日だけではなく、迷った日、立ち止まった日、もう一度動き出した日も、すべてが物語の一部です。</p>
<div class="user-bar"><input id="userId" placeholder="FCLユーザーID"><button id="load">物語を開く</button></div>
<div id="error" class="error" hidden></div>
</section>
<section id="story" hidden></section>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const date=v=>v?new Date(v).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'日付不明';
function showError(m){$('error').textContent=m;$('error').hidden=false}
async function load(){
 const id=$('userId').value.trim(); if(!id)return showError('FCLユーザーIDを入力してください。');
 $('load').disabled=true;$('load').textContent='取得中…';$('error').hidden=true;
 try{
  const ov=await fetch('/api/users/'+encodeURIComponent(id)+'/overview').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'取得失敗');return d});
  const participants=ov.challenger?.records||[];
  if(!participants.length){$('story').innerHTML='<div class="card empty">まだ挑戦者登録がありません。まずFCLで挑戦を登録すると、ここに物語が始まります。</div>';$('story').hidden=false;return;}
  const histories=await Promise.all(participants.map(p=>fetch('/api/core/history/'+encodeURIComponent(p.id)).then(r=>r.ok?r.json():null)));
  $('story').innerHTML=participants.map((p,i)=>{
   const h=histories[i]||{}; const c=h.checkin; const a=h.analysis; const o=h.outcome;
   const matches=(ov.matches||[]).filter(m=>m.role==='challenger' && (m.challenge||'')===(p.challenge||''));
   const events=[
    {at:p.created_at,label:'物語のはじまり',text:'「'+esc(p.challenge||'挑戦')+'」への挑戦を登録しました。目標：'+esc(p.goal||'未登録')},
    c?{at:c.checked_in_at,label:'今日の1ページ',text:'FCLチェックインを記録。現在の状態：'+esc(c.risk_level||'確認中')}:null,
    a?{at:a.created_at||c?.checked_in_at,label:'現在地を知る',text:esc(a.summary||a.label||'現在の状態を分析しました。')}:null,
    o?{at:o.created_at||null,label:'行動の結果',text:esc(o.result_note||o.summary||o.label||'行動結果を記録しました。')}:null,
    ...matches.filter(m=>m.status==='connected').map(m=>({at:m.updated_at,label:'支援者とつながる',text:'「'+esc(m.counterpart_name||'支援者')+'」と接続が成立しました。'}))
   ].filter(Boolean).sort((x,y)=>new Date(x.at||0)-new Date(y.at||0));
   return '<section class="card"><div class="story-head"><span class="pill">挑戦者</span><h2>'+esc(p.challenge||'挑戦')+'</h2><p>目標：'+esc(p.goal||'未登録')+'</p><p class="muted">'+events.length+'つの記録が、この物語に積み重なっています。</p></div><div class="timeline">'+
   (events.length?events.map(e=>'<div class="event"><div class="date">'+date(e.at)+'</div><div class="tag">'+esc(e.label)+'</div><p>'+e.text+'</p></div>').join(''):'<div class="empty">まだ物語の記録はありません。</div>')+
   '</div><p class="muted" style="margin-top:20px">あなたの物語は、まだ途中です。次の1ページを記録していきましょう。</p></section>';
  }).join('');
  $('story').hidden=false;
 }catch(e){$('story').hidden=true;showError(e.message||'物語の取得に失敗しました。')}
 finally{$('load').disabled=false;$('load').textContent='物語を開く'}
}
$('load').onclick=load;
const p=new URLSearchParams(location.search), initial=p.get('user_id')||localStorage.getItem('fcl-user-id')||'';
if(initial){$('userId').value=initial;load()}
})();
</script></body></html>
