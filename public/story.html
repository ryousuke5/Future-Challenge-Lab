<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCL｜あなたの挑戦の物語</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:#f6f7f9}main{max-width:980px;margin:auto;padding:28px 16px 64px}
.hero,.challenge-group,.story-detail{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
.hero{padding:26px;margin-bottom:16px}.hero h1{font-size:30px;margin:8px 0}.hero p{line-height:1.75;color:#475569;margin:6px 0}
.eyebrow{font-size:12px;letter-spacing:.12em;color:#64748b;font-weight:700}.muted{color:#64748b;font-size:13px}
.loading,.empty,.error{padding:16px;border-radius:14px}.loading,.empty{background:#f8fafc;color:#64748b}.error{background:#fef2f2;color:#991b1b}
.challenge-group{padding:20px;margin:16px 0}.challenge-group h2{margin:4px 0 14px;font-size:21px}.challenge-summary{color:#64748b;font-size:13px;margin-bottom:12px}
.person-list{display:grid;gap:10px}.person-card{display:block;width:100%;text-align:left;padding:16px;border:1px solid #e2e8f0;border-radius:15px;background:#f8fafc;color:#111827;cursor:pointer;font:inherit}
.person-card:hover{border-color:#94a3b8;background:#fff}.person-top{display:flex;justify-content:space-between;gap:12px;align-items:center}.person-name{font-size:17px;font-weight:800}.person-goal{margin-top:7px;color:#475569;line-height:1.6}.click-note{font-size:12px;color:#64748b;white-space:nowrap}
.story-detail{margin-top:10px;padding:18px;background:#fff}.detail-header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}.detail-header h3{margin:0 0 5px;font-size:20px}.detail-title{font-size:14px;color:#64748b}
.growth-summary{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:14px 0}.growth-stat{padding:14px;border-radius:14px;background:#f8fafc;border:1px solid #e2e8f0}.growth-stat strong{display:block;font-size:22px;margin-top:4px}.growth-highlight{margin-top:12px;padding:16px;border-radius:15px;background:linear-gradient(135deg,#eef6ff,#f5f3ff);line-height:1.8;color:#334155}
.story-section{margin-top:16px}.story-section h4{margin:0 0 10px;font-size:15px}.timeline{display:grid;gap:10px}.day-card{padding:15px;border:1px solid #e2e8f0;border-radius:14px;background:#fff}.day-head{display:flex;justify-content:space-between;gap:10px;align-items:center}.day-head strong{font-size:14px}.day-head span{font-size:12px;color:#64748b}.day-headline{margin:8px 0 6px;font-weight:800}.day-actions{margin:6px 0 0;padding-left:18px}.day-actions li{margin:5px 0;line-height:1.7}.day-growth{margin-top:10px;padding:11px 13px;border-radius:11px;background:#f8fafc;color:#475569;line-height:1.7}.day-growth strong{color:#111827}.detail-close{border:1px solid #cbd5e1;background:#fff;color:#111827;border-radius:10px;padding:8px 11px;font-weight:700;cursor:pointer}
@media(max-width:760px){.growth-summary{grid-template-columns:1fr 1fr}.person-top,.detail-header{flex-direction:column;align-items:flex-start}.click-note{white-space:normal}}
@media(max-width:480px){.growth-summary{grid-template-columns:1fr}}
</style>
</head>
<body><main>
<section class="hero">
  <div class="eyebrow">YOUR CHALLENGE STORY</div>
  <h1>あなたの挑戦の物語</h1>
  <p><strong>挑戦したことではなく、挑戦する中で「自分がどう動き、どう変わってきたか」</strong>を読むページです。</p>
  <p class="muted">挑戦テーマごとに人を選べます。本人が公開を承認した物語だけを表示しています。</p>
</section>
<section id="storyIndex">
  <div class="loading">挑戦の物語を読み込んでいます…</div>
</section>
</main>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const esc = (value) => String(value ?? '')
    .replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;')
    .replaceAll('"','&quot;').replaceAll("'","&#39;");

  const dateLabel = (value) => {
    if(!value) return '日付不明';
    const d=new Date(value+'T00:00:00');
    return Number.isNaN(d.getTime()) ? value : d.toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'});
  };

  function renderDetail(container, detail){
    const p=detail.participant || {};
    const o=detail.overview || {};
    const timeline=Array.isArray(detail.timeline) ? detail.timeline : [];

    const daysHtml=timeline.length ? timeline.map(day => {
      const actions=Array.isArray(day.actions) ? day.actions : [];
      const actionsHtml=actions.length
        ? '<ul class="day-actions">'+actions.map(a =>
            '<li><strong>'+esc(a.completed?'実行した':'取り組もうとした')+'：</strong>'+esc(a.text||'記録')+
            (a.result?'<br><span class="muted">結果：'+esc(a.result)+'</span>':'')+
          '</li>').join('')+'</ul>'
        : '<p class="muted">この日は行動記録はありません。</p>';

      return '<article class="day-card">' +
        '<div class="day-head"><strong>'+esc(day.headline||'この日のページ')+'</strong><span>'+esc(dateLabel(day.date))+'</span></div>' +
        (Array.isArray(day.summary)&&day.summary.length?'<p class="day-headline">'+esc(day.summary[0])+'</p>':'') +
        actionsHtml +
        '<div class="day-growth"><strong>この日の成長：</strong>'+esc(day.growth||'今日の記録が次のページにつながっています。')+'</div>' +
      '</article>';
    }).join('') : '<div class="empty">まだ行動のタイムラインはありません。</div>';

    container.innerHTML=
      '<div class="detail-header">' +
        '<div><div class="eyebrow">'+esc(p.challenge||'挑戦')+'</div><h3>'+esc(p.name||'匿名の挑戦者')+'</h3>' +
        (p.goal?'<div class="detail-title">目標：'+esc(p.goal)+'</div>':'')+
        '<div class="detail-title" style="margin-top:5px;">'+esc(detail.story_title||'自分の行動と成長の物語')+'</div></div>' +
        '<button type="button" class="detail-close">閉じる</button>' +
      '</div>' +
      '<div class="growth-summary">' +
        '<div class="growth-stat"><span class="muted">記録した日</span><strong>'+esc(o.recorded_days??0)+'</strong></div>' +
        '<div class="growth-stat"><span class="muted">現在地の記録</span><strong>'+esc(o.checkins??0)+'</strong></div>' +
        '<div class="growth-stat"><span class="muted">実行した行動</span><strong>'+esc(o.completed_actions??0)+'</strong></div>' +
        '<div class="growth-stat"><span class="muted">行動した日</span><strong>'+esc(o.action_days??0)+'</strong></div>' +
      '</div>' +
      '<div class="growth-highlight"><strong>この物語の成長</strong><br>'+esc(o.growth||'まだ物語の途中です。')+'</div>' +
      '<div class="story-section"><h4>自分の行動の軌跡</h4><div class="timeline">'+daysHtml+'</div></div>';

    container.querySelector('.detail-close')?.addEventListener('click',()=>{
      container.hidden=true;
      const trigger=container.previousElementSibling;
      if(trigger) trigger.setAttribute('aria-expanded','false');
    });
  }

  async function openPerson(button, detail, participantId){
    const open=!detail.hidden;
    if(open){
      detail.hidden=true;
      button.setAttribute('aria-expanded','false');
      return;
    }

    detail.hidden=false;
    button.setAttribute('aria-expanded','true');
    detail.innerHTML='<div class="loading">この人の行動と成長の物語を読み込んでいます…</div>';

    try{
      const response=await fetch('/api/story-person/'+encodeURIComponent(participantId));
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.error || '物語の詳細を取得できませんでした。');
      renderDetail(detail,data);
    }catch(error){
      detail.innerHTML='<div class="error">'+esc(error.message || '物語の詳細を取得できませんでした。')+'</div>';
    }
  }

  async function load(){
    try{
      const response=await fetch('/api/story-index');
      const data=await response.json().catch(()=>({}));
      if(!response.ok) throw new Error(data.error || '物語の取得に失敗しました。');

      const stories=Array.isArray(data.stories) ? data.stories : [];
      if(!stories.length){
        $('storyIndex').innerHTML='<div class="empty">現在、公開されている挑戦の物語はありません。</div>';
        return;
      }

      const groups=new Map();
      stories.forEach(story=>{
        const challenge=story.challenge || '挑戦テーマ未登録';
        if(!groups.has(challenge)) groups.set(challenge,[]);
        groups.get(challenge).push(story);
      });

      let personNo=0;
      $('storyIndex').innerHTML=[...groups.entries()].map(([challenge,people])=>{
        const cards=people.map(person=>{
          const id='story-person-'+(++personNo);
          return '<div>' +
            '<button type="button" class="person-card" aria-expanded="false" aria-controls="'+id+'">' +
              '<div class="person-top"><span class="person-name">'+esc(person.name || '匿名の挑戦者')+'</span><span class="click-note">クリックして行動と成長を見る</span></div>' +
              (person.goal ? '<div class="person-goal">目標：'+esc(person.goal)+'</div>' : '') +
            '</button>' +
            '<div id="'+id+'" class="story-detail" hidden></div>' +
          '</div>';
        }).join('');

        return '<section class="challenge-group">' +
          '<div class="eyebrow">CHALLENGE</div>' +
          '<h2>'+esc(challenge)+'</h2>' +
          '<div class="challenge-summary">'+people.length+'人の物語</div>' +
          '<div class="person-list">'+cards+'</div>' +
        '</section>';
      }).join('');

      document.querySelectorAll('.person-card').forEach(button=>{
        const detail=document.getElementById(button.getAttribute('aria-controls'));
        const participantId=(() => {
          const groupButtons=[...document.querySelectorAll('.person-card')];
          const index=groupButtons.indexOf(button);
          return stories[index]?.participant_id;
        })();
        button.addEventListener('click',()=>{
          if(participantId) openPerson(button,detail,participantId);
        });
      });
    }catch(error){
      $('storyIndex').innerHTML='<div class="error">'+esc(error.message || '物語の取得に失敗しました。')+'</div>';
    }
  }

  load();
})();
</script>
</body>
</html>
