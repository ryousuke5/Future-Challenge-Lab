<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>FCL｜あなたの挑戦の物語</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1f2937;background:#f6f7f9}
*{box-sizing:border-box}body{margin:0;background:#f6f7f9}main{max-width:900px;margin:auto;padding:28px 16px 64px}
.hero,.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;box-shadow:0 8px 30px rgba(15,23,42,.05)}
.hero{padding:26px;margin-bottom:16px}.card{padding:20px;margin-bottom:16px}.eyebrow{font-size:12px;letter-spacing:.12em;color:#64748b;font-weight:700}
h1{font-size:30px;margin:8px 0}h2{font-size:20px;margin:0 0 14px}h3{font-size:17px;margin:0 0 6px}p{line-height:1.7;margin:6px 0}.muted{color:#64748b;font-size:13px}
.user-bar{display:flex;gap:10px;align-items:center;margin-top:18px}input{flex:1;padding:12px;border:1px solid #cbd5e1;border-radius:12px;font:inherit}
button{border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;background:#111827;color:#fff}button.secondary{background:#fff;color:#111827;border:1px solid #cbd5e1}
button:disabled{opacity:.6}.error{padding:12px;border-radius:12px;background:#fef2f2;color:#991b1b;margin-bottom:14px}
.story-head{padding:18px;border-radius:16px;background:#f8fafc;margin-bottom:16px}.pill{display:inline-flex;padding:5px 9px;border-radius:999px;background:#eef2ff;color:#3730a3;font-size:12px;font-weight:700}
.timeline{position:relative;margin:8px 0 0 8px;padding-left:25px;border-left:2px solid #e2e8f0}.event{position:relative;padding:0 0 24px}.event:last-child{padding-bottom:0}
.event:before{content:"";position:absolute;left:-32px;top:4px;width:12px;height:12px;border-radius:50%;background:#64748b;border:3px solid #fff;box-shadow:0 0 0 2px #e2e8f0}
.date{font-size:12px;color:#64748b;margin-bottom:3px}.tag{font-size:12px;font-weight:700;color:#475569}.empty{padding:14px;background:#f8fafc;border-radius:12px;color:#64748b}.comment{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f8fafc;color:#334155;font-size:14px;line-height:1.7}.growth{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:10px;margin:12px 0}.growth-item{padding:14px;border:1px solid #e5e7eb;border-radius:14px;background:#fff}.growth-item strong{display:block;margin-bottom:5px}.story-ending{margin-top:18px;padding:18px;border-radius:16px;background:#f8fafc}.next-step{margin-top:14px;padding:14px;border-radius:14px;background:#fff}
@media(max-width:650px){.user-bar{flex-direction:column;align-items:stretch}.story-head>div[style*="grid-template-columns"]{grid-template-columns:1fr!important}}
.daily-card{padding:18px;border:1px solid #e5e7eb;border-radius:16px;background:#fff;margin-bottom:12px}.daily-meta{display:flex;justify-content:space-between;gap:10px;align-items:center;margin-bottom:8px}.page-no{font-size:12px;color:#64748b;font-weight:700}.daily-date{font-size:13px;color:#64748b}.daily-lines{margin:0;padding-left:20px}.daily-lines li{margin:7px 0;line-height:1.7}.daily-card details{margin-top:12px}.daily-card summary{cursor:pointer;color:#334155;font-weight:700}.detail-body{margin-top:10px;padding:12px 14px;border-radius:12px;background:#f8fafc}.detail-row{padding:8px 0;border-bottom:1px solid #e5e7eb;line-height:1.6}.detail-row:last-child{border-bottom:0}.milestone-comment{margin:12px 0;padding:14px 16px;border-left:4px solid #94a3b8;background:#f8fafc;border-radius:10px;line-height:1.7}.journal-history{margin:0 0 14px;padding:14px;border:1px solid #dbe4ee;border-radius:14px;background:#fff}.journal-history-heading h4{margin:9px 0 12px;font-size:1.05rem}.journal-history-body{padding:13px 14px;background:#f8fafc;border-radius:11px;line-height:1.85}.journal-history-body p{margin:0 0 10px}.journal-history-body p:last-child{margin-bottom:0}.roadmap{margin:16px 0 4px;padding:16px;border:1px solid #e5e7eb;border-radius:16px;background:#fff}.roadmap-title{font-size:14px;font-weight:700;margin-bottom:12px}.roadmap-track{display:flex;align-items:flex-start;gap:0;overflow-x:auto;padding:4px 2px 8px}.roadmap-step{min-width:150px;position:relative;text-align:center}.roadmap-step:not(:last-child):after{content:"";position:absolute;top:12px;left:50%;width:100%;height:2px;background:#e2e8f0}.roadmap-dot{position:relative;z-index:1;width:24px;height:24px;margin:0 auto 7px;border-radius:50%;border:2px solid #cbd5e1;background:#fff}.roadmap-step.done .roadmap-dot{background:#334155;border-color:#334155}.roadmap-step.current .roadmap-dot{box-shadow:0 0 0 4px #e2e8f0}.roadmap-label{font-size:12px;font-weight:700}.roadmap-note{font-size:11px;color:#64748b;margin-top:3px;line-height:1.4}.story-end{margin-top:18px;padding:20px;border-radius:16px;background:#f8fafc}@media(max-width:650px){.daily-meta{align-items:flex-start;flex-direction:column}}</style>
</head>
<body><main>
<section class="hero">
<div class="eyebrow">YOUR CHALLENGE STORY</div>
<h1>あなたの挑戦の物語</h1>
<p>できた日だけではなく、迷った日、立ち止まった日、もう一度動き出した日も、すべてが物語の一部です。</p>
<div class="user-bar"><input id="userId" placeholder="FCLユーザーID"><button id="load">物語を開く</button></div>
<div id="error" class="error" hidden></div>
</section>
<section id="story" hidden></section>
</main>
<script>
(() => {
const $=id=>document.getElementById(id);
const esc=v=>String(v??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'","&#39;");
const dateOnly=v=>v?new Date(v).toLocaleDateString('ja-JP',{year:'numeric',month:'numeric',day:'numeric'}):'日付不明';
const dateTime=v=>v?new Date(v).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'}):'日付不明';
function showError(m){$('error').textContent=m;$('error').hidden=false}

function dayKey(v){
  const d=new Date(v||0);
  if(Number.isNaN(d.getTime())) return 'unknown';
  const y=d.getFullYear(),m=String(d.getMonth()+1).padStart(2,'0'),day=String(d.getDate()).padStart(2,'0');
  return y+'-'+m+'-'+day;
}
function addItem(map,key,item){
  if(!map.has(key)) map.set(key,[]);
  map.get(key).push(item);
}
function meaningfulComment(day, checkins, actions, events, matches, allCheckins){
  const ownChecks=checkins||[];
  const ownActions=actions||[];
  const connected=(matches||[]).filter(m=>m.status==='connected');
  if(day.isStart) return '最初の一歩です。挑戦を言葉にできたことが、この物語の出発点です。';
  if(day.restarted) return '少し間が空いたあと、もう一度ここに戻ってきました。再開したこと自体が、この挑戦の一歩です。';
  if(day.newConnection) return '一人で進むだけでなく、誰かと一緒に進むページが加わりました。';
  if(day.firstCompletedAction) return '考えていたことを、実際の行動に移しました。今日の記録が現実の一歩になっています。';
  if(day.autonomyRise) return '前回より自己決定度が上がりました。少しずつ自分で選べる感覚の変化が記録されています。';
  if(day.autonomyDrop) return '今日は前回より自己決定度が下がっています。迷った日も止まった日も、挑戦の大切な一ページです。';
    return '';
}

function pickPhrase(pool, seed){
  return pool[Math.abs(seed)%pool.length];
}
function daySeed(day){
  return Array.from(day.key||'').reduce((sum,ch)=>sum+ch.charCodeAt(0),0)+day.checkins.length*7+day.actions.length*13+day.events.length*17;
}
function buildDailySummary(day){
  const lines=[];
  const checks=day.checkins, acts=day.actions, evs=day.events, con=day.connections;
  const latestCheck=checks[checks.length-1];
  const seed=daySeed(day);

  if(day.isStart){
    lines.push(pickPhrase([
      '「'+(day.challenge||'この挑戦')+'」への一歩を踏み出した。',
      '今日から、この挑戦の物語が始まった。',
      '挑戦したいことを言葉にして、スタート地点に立った。'
    ],seed));
    lines.push(pickPhrase([
      'まずは自分が進みたい方向を決めた。',
      'ここから日々の記録を積み重ねていく。',
      'まだ何も分からない。でも、始めたことが最初の一歩になった。'
    ],seed+1));
    lines.push('このページが、これからの物語の出発点になる。');
    return lines;
  }

  if(latestCheck){
    const score=Number(latestCheck.autonomy_total||0);
    lines.push(pickPhrase([
      '今日の自分の状態を、立ち止まって確かめた。',
      '今の感覚を言葉と数字にして、現在地を残した。',
      '今日のコンディションを記録し、自分の現在地を見つめた。',
      '今日という一日の状態を、物語の一ページとして残した。'
    ],seed));
    if(day.autonomyRise){
      lines.push(pickPhrase([
        '前回より「自分で選べている」感覚が強くなった。',
        '前のページから、自己決定度が一段上がった。',
        '迷いの中にも、自分で決められる部分が増えてきた。'
      ],seed+2));
    }else if(day.autonomyDrop){
      lines.push(pickPhrase([
        '今日は少し揺れた。それも今の自分を知る大切な記録になった。',
        '思うように進まない感覚も、そのまま一ページに残した。',
        '下がった日も含めて、自分の現在地を知る材料になった。'
      ],seed+2));
    }else{
      lines.push(pickPhrase([
        '前のページとの違いを見ながら、今の自分を確かめた。',
        '大きく変わらなくても、今日の現在地を残した。',
        '変化の大きさより、続けて記録したことに意味がある一日だった。'
      ],seed+2));
    }
  }else{
    lines.push(pickPhrase([
      '挑戦について考えたことを、一日の記録として残した。',
      '今日の出来事を、挑戦の物語に書き加えた。',
      'この日の動きや気づきを、一ページにまとめた。'
    ],seed));
  }

  const completed=acts.filter(a=>a.completed), unfinished=acts.filter(a=>!a.completed);
  if(completed.length){
    lines.push(pickPhrase([
      completed.length+'件の次の一歩を実際に動かした。',
      '考えていたことを行動に変え、'+completed.length+'件を実行した。',
      '「やる」と決めたことを、'+completed.length+'件現実に移した。'
    ],seed+3));
  }else if(acts.length){
    lines.push(pickPhrase([
      '次の一歩を決めた。まだ途中のものも残っている。',
      'やることを具体化し、次に進む準備を整えた。',
      '次の行動を書き出し、これから進む方向を残した。'
    ],seed+3));
  }else if(con.length){
    lines.push(pickPhrase([
      '一人で進むだけではなく、支援とのつながりが生まれた。',
      'この挑戦に、誰かと一緒に進むページが加わった。',
      '支えてくれる人との接点が、この物語に加わった。'
    ],seed+3));
  }else if(day.restarted){
    lines.push(pickPhrase([
      '少し間が空いたあと、もう一度この挑戦に戻ってきた。',
      '止まったところから、再びページをめくった。',
      '一度離れても、またここに戻ってきた。'
    ],seed+3));
  }else if(evs.some(e=>(e.features?.action_type||e.label)==='core_decision')){
    lines.push(pickPhrase([
      '迷いながらも、自分で次の選択を決めた。',
      'いくつかの選択肢から、自分の次の一歩を選んだ。',
      '「こうしてみる」と、自分なりの方向を決めた。'
    ],seed+3));
  }else{
    lines.push(pickPhrase([
      '今日の記録が、次のページへ続く材料になった。',
      '小さな積み重ねを残して、一日を終えた。',
      '今日の一ページを残し、物語を一つ先へ進めた。'
    ],seed+3));
  }

  if(con.length && !lines.some(x=>x.includes('支援'))){
    lines[2]=pickPhrase(['支援とのつながりも、この物語の一部になった。','誰かと進む可能性が、このページに加わった。','一人ではない進み方も、次の選択肢として残った。'],seed+5);
  }else if(day.restarted && !lines.some(x=>x.includes('戻')||x.includes('再び')||x.includes('めくった'))){
    lines[2]=pickPhrase(['止まったあとにも、次のページは続いている。','また動き出せたことが、今日の一歩になった。','再開した今日が、新しいページになった。'],seed+5);
  }else if(completed.length){
    lines[2]=pickPhrase(['今日の行動が、次のページへの橋になった。','実際に動いたことで、物語が一つ先へ進んだ。','行動した事実が、今日のページに刻まれた。'],seed+5);
  }else if(unfinished.length){
    lines[2]=pickPhrase(['まだ決まっていない部分も、次のページへの材料として残った。','途中のままでも、今日の自分を記録できた。','未完了も含めて、今の現在地が見えてきた。'],seed+5);
  }
  return lines.slice(0,3);
}

function buildJournalResponse(analysis,outcomeStatus=''){
  const r=analysis||{};
  const clean=v=>String(v??'').replace(/^(現在地|今日の気づき|FCLの学習結果|今回の解決策|次の一歩|学習結果)：?/,'').replace(/\s+/g,' ').trim();
  const insight=clean(r.insight), state=clean(r.state);
  const opening={
    completed:['今日も一日、お疲れさまでした。','今日もちゃんと前に進めています。','今日の記録、読みました。お疲れさまです。'],
    partial:['今日もお疲れさまでした。','今日の記録、読みました。','今日も一日、よくやりました。'],
    not_completed:['今日もお疲れさまでした。','今日は思うようにいかない日だったかもしれませんね。','今日の記録、ちゃんと受け取りました。'],
    not_started:['今日もお疲れさまでした。','今日の記録、読みました。','ここまで書き残せたことも、ちゃんと一歩です。']
  }[outcomeStatus]||['今日もお疲れさまでした。','今日の記録、読みました。'];
  const middle={
    completed:['できたことは、そのまま素直に喜んでいいと思います。小さくても、続けた一日はちゃんと積み重なっています。','毎日すべてを完璧にする必要はありません。今日できたことが、明日の自分を助けてくれます。'],
    partial:['全部できなかったとしても大丈夫です。続けられた部分には、ちゃんと意味があります。','今日は全部を取り切る日ではなかっただけ。できたところを残して、また明日につなげれば十分です。'],
    not_completed:['できなかった日は、失敗として片づけなくて大丈夫です。そういう日も含めて、自分のペースを知る材料になります。','うまくいかない日があるのは自然なことです。今日の自分を責めるより、明日また戻ってこられれば十分です。'],
    not_started:['まだ動けていなくても、焦らなくて大丈夫です。始める日は、いつでもここから作れます。','今日は準備の日だったのかもしれません。大きく動かなくても、次につながる一日です。']
  }[outcomeStatus]||['今日できたことも、できなかったことも、どちらも今の自分の大切な記録です。','毎日完璧である必要はありません。続けようとしていること自体に意味があります。'];
  const closing={
    completed:['今日の自分に、ひとまず「よくやった」と言ってあげてください。','この調子で、明日も無理のない一歩でいきましょう。'],
    partial:['明日はまた、できるところからで大丈夫です。','焦らず、自分のペースで続けていきましょう。'],
    not_completed:['今日は休んでもいい。明日、また一歩戻ってくれば大丈夫です。','続けることは、毎日完璧にやることではありません。また明日で大丈夫です。'],
    not_started:['明日は3分でもいいので、できそうなところから始めてみましょう。','まずは小さく。動き出せたら、それで十分です。']
  }[outcomeStatus]||['また明日、自分のペースでいきましょう。','今日も一歩。お疲れさまでした。'];
  const seed=Array.from((insight||'')+'|'+(state||'')+'|'+outcomeStatus).reduce((sum,ch)=>sum+ch.charCodeAt(0),0);
  const pick=(pool,offset=0)=>pool[(seed+offset)%pool.length];
  const personalizedLine=insight&&!/観測|学習|解決策|次の一歩|状態を整理/.test(insight)?'今日の記録から、'+insight.replace(/[。．]$/,'')+'という部分も、ちゃんと伝わってきました。':'';
  return [pick(opening),personalizedLine,pick(middle,1),pick(closing,2)].filter(Boolean);
}
function renderDetails(day){
  const rows=[];
  if(day.journalReply?.length){
    rows.push('<div class="journal-history"><div class="journal-history-heading"><span class="section-tag">FCL RESPONSE</span><h4>あなたの日誌への返信</h4></div><div class="journal-history-body">'+day.journalReply.map(p=>'<p>'+esc(p)+'</p>').join('')+'</div></div>');
  }
  day.checkins.forEach((c,i)=>rows.push('<div class="detail-row"><strong>チェックイン '+(i+1)+'回目</strong><br>自己決定度：'+esc(c.autonomy_total||0)+' / 25　現在の状態：'+esc(c.risk_level||'確認中')+'<br><span class="muted">'+dateTime(c.checked_in_at)+'</span></div>'));
  day.actions.forEach(a=>rows.push('<div class="detail-row"><strong>'+(a.completed?'実行した一歩':'記録した一歩')+'</strong><br>'+esc(a.action_text||'行動記録')+(a.result_note?'<br>結果：'+esc(a.result_note):'')+'<br><span class="muted">'+dateTime(a.completed_at||a.created_at)+'</span></div>'));
  day.events.forEach(e=>{
    const type=e.features?.action_type||e.label;
    if(type==='core_analysis') rows.push('<div class="detail-row"><strong>現在地を分析</strong><br>'+esc(e.features?.result?.summary||e.features?.result?.insight||'現在の状態を分析しました。')+'</div>');
    if(type==='core_decision') rows.push('<div class="detail-row"><strong>自分で選ぶ</strong><br>選択：'+esc(e.features?.selected_option||'未選択')+'</div>');
    if(type==='core_outcome') rows.push('<div class="detail-row"><strong>行動の結果</strong><br>'+esc(e.features?.result_note||e.features?.outcome_status||'行動結果を記録しました。')+'</div>');
  });
  day.connections.forEach(()=>rows.push('<div class="detail-row"><strong>支援者とつながる</strong><br>支援者との接続が成立しました。</div>'));
  if(!rows.length) rows.push('<div class="detail-row">この日の詳しい記録はありません。</div>');
  return '<div class="detail-body">'+rows.join('')+'</div>';
}

async function load(){
 const id=$('userId').value.trim();
 if(!id)return showError('FCLユーザーIDを入力してください。');
 $('load').disabled=true;$('load').textContent='取得中…';$('error').hidden=true;
 try{
  const ov=await fetch('/api/users/'+encodeURIComponent(id)+'/overview').then(async r=>{const d=await r.json();if(!r.ok)throw Error(d.error||'取得失敗');return d});
  const participants=ov.challenger?.records||[];
  if(!participants.length){
    $('story').innerHTML='<div class="card empty">まだ挑戦者登録がありません。まずFCLで挑戦を登録すると、ここに物語が始まります。</div>';
    $('story').hidden=false;return;
  }

  const histories=await Promise.all(participants.map(p=>fetch('/api/story/'+encodeURIComponent(p.id)).then(async r=>r.ok?r.json():null)));
  $('story').innerHTML=participants.map((p,i)=>{
    const h=histories[i]||{};
    const checkins=h.checkins||[], actions=h.actions||[], events=h.events||[], matches=h.matches||[], journalReplies=h.journal_replies||[];
    const connectedMatches=matches.filter(m=>m.status==='connected');
    const map=new Map();

    if(p.created_at) addItem(map,dayKey(p.created_at),{kind:'start',at:p.created_at});
    checkins.forEach(c=>addItem(map,dayKey(c.checked_in_at),{kind:'checkin',data:c,at:c.checked_in_at}));
    actions.forEach(a=>addItem(map,dayKey(a.completed_at||a.created_at),{kind:'action',data:a,at:a.completed_at||a.created_at}));
    events.forEach(e=>{
      const type=e.features?.action_type||e.label;
      if(['core_analysis','core_decision','core_outcome'].includes(type)) addItem(map,dayKey(e.created_at),{kind:type,data:e,at:e.created_at});
    });
    connectedMatches.forEach(m=>addItem(map,dayKey(m.updated_at||m.created_at),{kind:'connection',data:m,at:m.updated_at||m.created_at}));
    const checkinDateById=new Map(checkins.map(ch=>[ch.id,dayKey(ch.checked_in_at)]));
    journalReplies.forEach(reply=>{
      const key=checkinDateById.get(reply.checkin_id)||dayKey(reply.created_at||reply.displayed_at);
      addItem(map,key,{kind:'journal_reply',data:reply,at:reply.created_at||reply.displayed_at});
    });

    const ordered=Array.from(map.entries()).sort((a,b)=>a[0]<b[0]?-1:1);
    const totalDays=ordered.length;
    const allCheckinsAsc=[...checkins].sort((a,b)=>new Date(a.checked_in_at)-new Date(b.checked_in_at));
    const completedAsc=actions.filter(a=>a.completed).sort((a,b)=>new Date(a.completed_at||a.created_at)-new Date(b.completed_at||b.created_at));
    const firstCompletedKey=completedAsc[0]?dayKey(completedAsc[0].completed_at||completedAsc[0].created_at):'';
    const daily=ordered.map(([key,items],idx)=>{
      const d={
        key,items,checkins:items.filter(x=>x.kind==='checkin').map(x=>x.data).sort((a,b)=>new Date(a.checked_in_at)-new Date(b.checked_in_at)),
        actions:items.filter(x=>x.kind==='action').map(x=>x.data),
        events:items.filter(x=>['core_analysis','core_decision','core_outcome'].includes(x.kind)).map(x=>x.data),
        connections:items.filter(x=>x.kind==='connection').map(x=>x.data),
        journalReply:items.filter(x=>x.kind==='journal_reply').map(x=>x.data).sort((a,b)=>new Date(a.created_at||a.displayed_at||0)-new Date(b.created_at||b.displayed_at||0)),
        isStart:items.some(x=>x.kind==='start'),restarted:false,newConnection:false,firstCompletedAction:false,autonomyRise:false,autonomyDrop:false,
        challenge:p.challenge||'挑戦'
      };
      if(d.checkins.length){
        const current=d.checkins[d.checkins.length-1];
        const currentIndex=allCheckinsAsc.findIndex(x=>x.id===current.id || x.checked_in_at===current.checked_in_at);
        const prev=currentIndex>0?allCheckinsAsc[currentIndex-1]:null;
        if(prev){
          const gap=(new Date(current.checked_in_at)-new Date(prev.checked_in_at))/86400000;
          d.restarted=gap>1;
          const diff=Number(current.autonomy_total||0)-Number(prev.autonomy_total||0);
          d.autonomyRise=diff>=2; d.autonomyDrop=diff<=-2;
        }
      }
      if(d.connections.length) d.newConnection=true;
      if(d.actions.some(a=>a.completed) && key===firstCompletedKey) d.firstCompletedAction=true;
      return d;
    });

    // Page numbers follow check-in history when available; activity-only days receive the nearest page marker.
    let pageNo=1;
    const cards=daily.map((d,idx)=>{
      const lines=buildDailySummary(d);
      const comment=meaningfulComment(d,d.checkins,d.actions,d.events,d.connections,allCheckinsAsc);
      const pageLabel='第'+pageNo+'ページ';
      pageNo++;
      const details=renderDetails(d);
      return '<article class="daily-card"><div class="daily-meta"><span class="page-no">'+pageLabel+'</span><span class="daily-date">'+dateOnly(d.key)+'</span></div><h3 style="margin:0 0 8px;">'+(d.isStart?'物語のはじまり':idx===daily.length-1?'今日のページ':'この日のページ')+'</h3><ol class="daily-lines">'+lines.map(x=>'<li>'+esc(x)+'</li>').join('')+'</ol>'+
        (comment?'<div class="milestone-comment"><strong>FCLからのコメント</strong><br>'+esc(comment)+'</div>':'')+
        '<details><summary>この日の詳細を見る</summary>'+details+'</details></article>';
    }).join('');

    const startAt=p.created_at?new Date(p.created_at):null;
    const days=startAt?Math.max(1,Math.floor((Date.now()-startAt.getTime())/86400000)+1):null;
    const completedActions=actions.filter(a=>a.completed).length;
    const actionDays=new Set(actions.map(a=>dayKey(a.completed_at||a.created_at))).size;
    const roadmapSteps=[
      {label:'挑戦を始める',note:'出発点',done:true},
      {label:'現在地を記録する',note:checkins.length?checkins.length+'回記録':'これから',done:checkins.length>0},
      {label:'次の一歩を実行する',note:completedActions?completedActions+'件実行':'これから',done:completedActions>0},
      {label:'支援とつながる',note:connectedMatches.length?connectedMatches.length+'件接続':'必要なときに',done:connectedMatches.length>0},
      {label:'今日',note:'ここから先へ',done:true,current:true}
    ];
    const roadmapHtml='<div class="roadmap"><div class="roadmap-title">あなたの挑戦のロードマップ</div><div class="roadmap-track">'+roadmapSteps.map(s=>'<div class="roadmap-step '+(s.done?'done ':'')+(s.current?'current':'')+'"><div class="roadmap-dot"></div><div class="roadmap-label">'+esc(s.label)+'</div><div class="roadmap-note">'+esc(s.note)+'</div></div>').join('')+'</div><p class="muted" style="margin-top:8px">できたことだけでなく、まだ途中の場所も見えるようにしています。</p></div>';

    const growth=[];
    if(checkins.length) growth.push('チェックイン '+checkins.length+'回');
    if(completedActions) growth.push('次の一歩を '+completedActions+'件実行');
    if(connectedMatches.length) growth.push('支援接続 '+connectedMatches.length+'件');
    const storyText='あなたはこの挑戦を始めてから'+(days??'-')+'日。'+checkins.length+'回、自分の現在地を記録し、'+completedActions+'件の行動を残しました。'+(growth.length?' '+growth.join('・')+'。':'')+'まだ途中です。でも、最初の日から今日までの記録そのものが、あなたの物語です。';

    return '<section class="card"><div class="story-head"><span class="pill">挑戦者</span><h2>'+esc(p.challenge||'挑戦')+'</h2><p>目標：'+esc(p.goal||'未登録')+'</p><div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:16px"><div style="padding:12px;background:#fff;border-radius:12px"><div class="muted">挑戦の日数</div><strong style="font-size:22px">'+(days??'-')+'日</strong></div><div style="padding:12px;background:#fff;border-radius:12px"><div class="muted">チェックイン</div><strong style="font-size:22px">'+checkins.length+'回</strong></div><div style="padding:12px;background:#fff;border-radius:12px"><div class="muted">行動した日</div><strong style="font-size:22px">'+actionDays+'日</strong></div></div><p class="muted" style="margin-top:14px">第1ページから始まり、下へスクロールするほど現在のページへ進みます。</p></div>'+roadmapHtml+'<div>'+cards+'</div><div class="story-end"><strong>ここまでの物語</strong><p>'+storyText+'</p><div class="next-step"><strong>次の1ページ</strong><p>今日の状態を記録し、今の自分に合った小さな一歩を選んでいきましょう。</p></div></div><p class="muted" style="margin-top:20px">あなたの物語は、まだ途中です。次の1ページを記録していきましょう。</p></section>';
  }).join('');
  $('story').hidden=false;
 }catch(e){$('story').hidden=true;showError(e.message||'物語の取得に失敗しました。')}
 finally{$('load').disabled=false;$('load').textContent='物語を開く'}
}
$('load').onclick=load;
const p=new URLSearchParams(location.search), initial=p.get('user_id')||localStorage.getItem('fcl-user-id')||'';
if(initial){$('userId').value=initial;load()}
})();
</script></body></html>
