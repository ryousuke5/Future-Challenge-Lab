services:
  - type: web
    name: future-challenge-lab
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeployTrigger: commit
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_EMAIL_MODEL
        value: gpt-4o-mini
      - key: RESEND_API_KEY
        sync: false
      - key: FCL_FROM_EMAIL
        sync: false
      - key: FCL_PUBLIC_URL
        sync: false
      - key: EMAIL_WORKER_POLL_MS
        value: "15000"
